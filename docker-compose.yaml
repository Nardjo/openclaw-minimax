services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    user: root
    ports:
      - "18789:18789"
    environment:
      - HOME=/home/node
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_BIND=loopback
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - XDG_CONFIG_HOME=/home/node/.openclaw
      # AI Provider: MiniMax Coding Plan
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # Telegram bots - ajoutez autant que nécessaire
      - TELEGRAM_BOT_TOKEN_GENERAL=${TELEGRAM_BOT_TOKEN_GENERAL}
      - TELEGRAM_BOT_TOKEN_TECH=${TELEGRAM_BOT_TOKEN_TECH}
      - TELEGRAM_BOT_TOKEN_COMMERCIAL=${TELEGRAM_BOT_TOKEN_COMMERCIAL}
      # Admin Telegram ID pour allowlist
      - TELEGRAM_ADMIN_USER_ID=${TELEGRAM_ADMIN_USER_ID}
    volumes:
      - config:/home/node/.openclaw/config
      - workspaces:/home/node/.openclaw/workspaces
      - qqbot:/home/node/.openclaw/qqbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R node:node /home/node/.openclaw 2>/dev/null || true
        mkdir -p /home/node/.openclaw/config
        mkdir -p /home/node/.openclaw/qqbot/data
        chown -R node:node /home/node/.openclaw/qqbot
        # Symlink la config vers le volume persistant
        if [ -f /home/node/.openclaw/config/openclaw.json ] && [ ! -L /home/node/.openclaw/openclaw.json ]; then
          # Restaurer depuis le volume persistant
          ln -sf /home/node/.openclaw/config/openclaw.json /home/node/.openclaw/openclaw.json
        elif [ ! -L /home/node/.openclaw/openclaw.json ]; then
          # Créer le symlink pour futures persistance
          touch /home/node/.openclaw/config/openclaw.json
          ln -sf /home/node/.openclaw/config/openclaw.json /home/node/.openclaw/openclaw.json
        fi
        chown -R node:node /home/node/.openclaw/config
        exec su node -c "node dist/index.js gateway --bind loopback --port 18789 --allow-unconfigured"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  config:
  workspaces:
  qqbot:
